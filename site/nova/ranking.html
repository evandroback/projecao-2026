<style>
/* Layout: uma régua de controles fixa no topo e a tabela-ranking embaixo; números em fonte condensada, como na apuração. */
:root {
  --bg: #f3f3f1; --panel: #ffffff; --panel-2: #ebebe8; --line: #dcdcd7; --fg: #171717; --muted: #5d5d5d; --faint: #767676;
  --flavio: #1f5fe0; --lula: #d2303a; --outros: #9a9a94; --foco: #a86a0c;
  --f-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111111; --panel: #1a1a1a; --panel-2: #242424; --line: #2e2e2e; --fg: #f1f1f1; --muted: #a4a4a4; --faint: #808080;
  --flavio: #5a94ff; --lula: #ff5a60; --outros: #6b6b66; --foco: #f2b24c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111111; --panel: #1a1a1a; --panel-2: #242424; --line: #2e2e2e; --fg: #f1f1f1; --muted: #a4a4a4; --faint: #808080;
  --flavio: #5a94ff; --lula: #ff5a60; --outros: #6b6b66; --foco: #f2b24c; color-scheme: dark; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--f-ui); }
.pagina { max-width: 1180px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1 { font: 700 clamp(30px, 6vw, 46px)/1.02 var(--f-num); letter-spacing: .005em; margin: 0; text-wrap: balance; }
.lide { color: var(--muted); margin: 6px 0 0; max-width: 68ch; }
.rot { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.f { color: var(--flavio); } .l { color: var(--lula); } .m { color: var(--muted); }

/* placar nacional */
.placar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.placar > div { background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.placar b { display: block; font: 700 34px/1.05 var(--f-num); font-variant-numeric: tabular-nums; }
.placar small { color: var(--muted); font-size: 13px; }

/* controles */
.controles { background: var(--panel); border-radius: 12px; padding: 14px; display: grid; gap: 12px; }
.linha-ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.campo { display: grid; gap: 4px; min-width: 0; }
.campo label, .campo .rot { font-size: 12px; }
select, input[type="search"] { font: inherit; font-size: 15px; color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
input[type="search"] { width: min(260px, 100%); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button, .botao { font: inherit; font-size: 14px; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.botao { border-radius: 8px; }
button:focus-visible, select:focus-visible, input:focus-visible, th button:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }

/* resumo da seleção */
.resumo { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; font-size: 14px; color: var(--muted); }
.resumo b { color: var(--fg); font-family: var(--f-num); font-size: 19px; font-weight: 600; }
.barra { display: flex; height: 10px; border-radius: 3px; overflow: hidden; background: var(--panel-2); }
.barra i { display: block; height: 100%; }

/* tabela */
.tab-wrap { overflow-x: auto; background: var(--panel); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th, td { padding: 8px 10px; border-top: 1px solid var(--line); white-space: nowrap; text-align: right; }
thead th { border-top: 0; position: sticky; top: 0; background: var(--panel); z-index: 1; }
th button { font: inherit; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; background: none; border: 0; padding: 0; cursor: pointer; }
th button[aria-sort="descending"]::after { content: " ↓"; color: var(--fg); }
th button[aria-sort="ascending"]::after { content: " ↑"; color: var(--fg); }
td.cid, th.cid { text-align: left; white-space: normal; min-width: 150px; }
td.pos { color: var(--faint); width: 3.5em; }
td .uf { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
td.num { font-size: 17px; }
td.bar { width: 130px; }
td.bar .barra { width: 120px; height: 8px; }
.destaque { font-weight: 700; }
.vazio { padding: 28px; text-align: center; color: var(--muted); }
.mais { display: flex; justify-content: center; gap: 10px; padding: 12px; }
.nota { color: var(--muted); font-size: 13px; max-width: 80ch; }
.legenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
@media (max-width: 640px) {
  td.bar, th.bar { display: none; }
  th, td { padding: 7px 7px; }
  td.num { font-size: 16px; }
}
@media (prefers-reduced-motion: no-preference) { .chips button, .botao { transition: background .12s, color .12s; } }
</style>

<div class="pagina">
  <header>
    <div class="rot">Eleição presidencial · 1º turno · 4 de outubro de 2026</div>
    <h1>Ranking das cidades no 1º turno</h1>
    <p class="lide">Votos válidos de cada candidato em cada município, contados urna por urna pelo TSE. Ordene pela coluna que quiser e filtre por região, estado e tamanho da cidade.</p>
  </header>

  <section class="placar" aria-label="Resultado no Brasil" id="placar"></section>

  <section class="controles" aria-label="Filtros">
    <div class="linha-ctl">

      <div class="campo"><label for="f-tam">Tamanho da cidade</label>

          <option value="100000">100 mil ou mais</option>
          <option value="500000">500 mil ou mais</option>
        </select></div>
      <div class="campo"><label for="f-busca">Buscar cidade</label><input type="search" id="f-busca" placeholder="ex.: Medianeira" autocomplete="off"></div>
    </div>
    <div class="campo"><span class="rot">Região</span><div class="chips" id="f-reg" role="group" aria-label="Região"></div></div>
    <div class="linha-ctl">
      <label class="check"><input type="checkbox" id="f-todos"> Mostrar todos os candidatos, brancos e nulos</label>
      <button class="botao" id="f-ordem" type="button">Inverter a ordem</button>
    </div>
  </section>

  <section aria-label="Seleção">
    <div class="resumo" id="resumo"></div>
    <div class="barra" id="resumo-barra" style="margin-top:8px" aria-hidden="true"></div>
  </section>

  <div class="tab-wrap">
    <table id="tab">
      <thead id="cab"></thead>
      <tbody id="corpo"></tbody>
    </table>
    <div class="mais" id="mais"></div>
  </div>

  <div class="legenda" id="legenda"></div>
  <p class="nota" id="nota"></p>
</div>

  $('f-cand').innerHTML = optCand.join('') + '<option value="dif">Diferença Flávio − Lula (pontos)</option><option value="val">Votos válidos (tamanho)</option>';
  function opcoesUF() {
    const ufs = D.ufs.filter(u => !st.reg || (st.reg === 'BR' ? u !== 'ZZ' : (REG[u] || 'EX') === st.reg)).sort((a, b) => NOME_UF[a].localeCompare(NOME_UF[b], 'pt'));
    $('f-uf').innerHTML = '<option value="">Todos</option>' + ufs.map(u => `<option value="${u}">${esc(NOME_UF[u])}</option>`).join('');
    if (st.uf && !ufs.includes(st.uf)) st.uf = '';
    $('f-uf').value = st.uf;
  }
  $('f-reg').innerHTML = [['BR', 'Brasil'], ...Object.entries(NOME_REG), ['', 'Brasil e exterior']].map(([k, n]) => `<button type="button" data-r="${k}" aria-pressed="${k === st.reg}">${n}</button>`).join('');
  opcoesUF();

  // ---- filtro e ordem ----
  const valorCol = (m, col) => col === 'dif' ? m.p[0] - m.p[1] : col === 'val' ? m.val : col === 'br' ? (m.tot ? 100 * m.br / m.tot : NaN) : col === 'nu' ? (m.tot ? 100 * m.nu / m.tot : NaN) : col === 'nome' ? m.chave : m.p[+col.slice(1)];
  function selecao() {
    const b = semAcento(st.busca.trim());
    return M.filter(m => (!st.reg || (st.reg === 'BR' ? m.reg !== 'EX' : m.reg === st.reg)) && (!st.uf || m.uf === st.uf) && m.val >= st.tam && (!b || m.chave.includes(b)));
  }
  function ordenar(lista) {
    const c = st.col, s = st.desc ? -1 : 1;
    if (c === 'nome') return lista.sort((a, b) => -s * a.nome.localeCompare(b.nome, 'pt'));
    return lista.sort((a, b) => {
      const x = valorCol(a, c), y = valorCol(b, c);
      if (!Number.isFinite(x)) return 1; if (!Number.isFinite(y)) return -1;
      return s * (x - y) || b.val - a.val;
    });
  }

  // ---- desenho ----
  const COR = k => k === 0 ? 'var(--flavio)' : k === 1 ? 'var(--lula)' : 'var(--outros)';
  const barra = (p0, p1) => `<span class="barra"><i style="width:${p1}%;background:var(--lula)"></i><i style="width:${Math.max(0, 100 - p0 - p1)}%;background:var(--outros)"></i><i style="width:${p0}%;background:var(--flavio)"></i></span>`;
  function cabecalho() {
    const th = (col, txt, cls = '') => `<th class="${cls}" scope="col"><button type="button" data-col="${col}" ${st.col === col ? `aria-sort="${st.desc ? 'descending' : 'ascending'}"` : ''}>${txt}</button></th>`;
    let h = `<tr><th class="pos" scope="col">#</th>${th('nome', 'Cidade', 'cid')}${th('c0', 'Flávio')}${th('c1', 'Lula')}${th('dif', 'Dif.')}<th class="bar" scope="col"><span class="rot">Lula · outros · Flávio</span></th>${th('val', 'Válidos')}`;
    if (st.todos) { for (let k = 2; k < NC; k++) h += th('c' + k, esc(nomeCand(k))); h += th('br', 'Brancos') + th('nu', 'Nulos'); }
    $('cab').innerHTML = h + '</tr>';
  }
  function desenhar() {
    const lista = ordenar(selecao());
    // resumo da seleção
    const soma = Array(NC).fill(0); let val = 0;
    for (const m of lista) { m.v.forEach((x, k) => soma[k] += x); val += m.val; }
    const pf = val ? 100 * soma[0] / val : NaN, pl = val ? 100 * soma[1] / val : NaN;
    const onde = [st.uf ? NOME_UF[st.uf] : st.reg === 'BR' ? 'Brasil (sem o exterior)' : st.reg ? NOME_REG[st.reg] : 'Brasil e exterior', st.tam ? `cidades com ${I(st.tam)}+ votos válidos` : '', st.busca ? `busca "${esc(st.busca)}"` : ''].filter(Boolean).join(' · ');
    $('resumo').innerHTML = lista.length ? `<span>${esc(onde)}: <b>${I(lista.length)}</b> ${lista.length === 1 ? 'cidade' : 'cidades'}</span><span>Flávio <b class="f">${P(pf, 2)}%</b></span><span>Lula <b class="l">${P(pl, 2)}%</b></span><span>outros <b>${P(100 - pf - pl, 2)}%</b></span><span><b>${I(val)}</b> votos válidos</span>` : '';
    $('resumo-barra').innerHTML = lista.length ? `<i style="width:${pl}%;background:var(--lula)"></i><i style="width:${Math.max(0, 100 - pf - pl)}%;background:var(--outros)"></i><i style="width:${pf}%;background:var(--flavio)"></i>` : '';
    cabecalho();
    if (!lista.length) { $('corpo').innerHTML = `<tr><td colspan="20" class="vazio">Nenhuma cidade com esses filtros. Tente outra região, outro estado ou um tamanho menor.</td></tr>`; $('mais').innerHTML = ''; return; }
    const ver = lista.slice(0, st.mostrar), colAtiva = st.col;
    let html = '';
    ver.forEach((m, i) => {
      const dif = m.p[0] - m.p[1];
      const cel = (col, conteudo, cls = 'num') => `<td class="${cls}${colAtiva === col ? ' destaque' : ''}">${conteudo}</td>`;
      html += `<tr><td class="pos num">${i + 1}</td><td class="cid">${esc(m.nome)}<span class="uf">${m.uf === 'ZZ' ? 'Exterior' : m.uf}</span></td>`
        + cel('c0', `<span class="f">${P(m.p[0])}%</span>`) + cel('c1', `<span class="l">${P(m.p[1])}%</span>`)
        + cel('dif', `<span class="${dif >= 0 ? 'f' : 'l'}">${dif > 0 ? '+' : dif < 0 ? '−' : ''}${P(Math.abs(dif))}</span>`)
        + `<td class="bar">${barra(m.p[0], m.p[1])}</td>` + cel('val', I(m.val));
      if (st.todos) { for (let k = 2; k < NC; k++) html += cel('c' + k, P(m.p[k], 2) + '%'); html += cel('br', P(m.tot ? 100 * m.br / m.tot : NaN, 2) + '%') + cel('nu', P(m.tot ? 100 * m.nu / m.tot : NaN, 2) + '%'); }
      html += '</tr>';
    });
    $('corpo').innerHTML = html;
    const falta = lista.length - ver.length;
    $('mais').innerHTML = falta > 0 ? `<button class="botao" type="button" id="b-mais">Mostrar mais ${I(Math.min(100, falta))}</button><button class="botao" type="button" id="b-todas">Mostrar todas (${I(lista.length)})</button>` : `<span class="m" style="font-size:13px">${I(lista.length)} ${lista.length === 1 ? 'cidade' : 'cidades'}</span>`;
  }

  // ---- eventos ----
  const mudou = () => { st.mostrar = 100; desenhar(); };
  $('f-cand').addEventListener('change', e => { st.col = e.target.value; st.desc = true; mudou(); });
  $('f-uf').addEventListener('change', e => { st.uf = e.target.value; if (st.uf) { st.reg = REG[st.uf] || 'EX'; marcarReg(); } mudou(); });
  $('f-tam').addEventListener('change', e => { st.tam = +e.target.value; mudou(); });
  let tb = null; $('f-busca').addEventListener('input', e => { clearTimeout(tb); tb = setTimeout(() => { st.busca = e.target.value; mudou(); }, 120); });
  $('f-todos').addEventListener('change', e => { st.todos = e.target.checked; desenhar(); });
  $('f-ordem').addEventListener('click', () => { st.desc = !st.desc; mudou(); });
  function marcarReg() { for (const b of $('f-reg').querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.r === st.reg); }
  $('f-reg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; st.reg = b.dataset.r; st.uf = ''; marcarReg(); opcoesUF(); mudou(); });
  $('cab').addEventListener('click', e => { const b = e.target.closest('button[data-col]'); if (!b) return; const c = b.dataset.col; if (st.col === c) st.desc = !st.desc; else { st.col = c; st.desc = c !== 'nome'; } if ([...$('f-cand').options].some(o => o.value === c)) $('f-cand').value = c; mudou(); });
  $('mais').addEventListener('click', e => { if (e.target.id === 'b-mais') { st.mostrar += 100; desenhar(); } else if (e.target.id === 'b-todas') { st.mostrar = Infinity; desenhar(); } });

  // ---- legenda e nota ----
  $('legenda').innerHTML = '<span class="rot" style="width:100%">Candidatos (número na urna)</span>' + D.candidatos.map(([nr, nome], k) => `<span><span class="num" style="color:${COR(k)}">${nr}</span> ${esc(nomeBonito(nome))} — ${P(100 * somaBR[k] / valBR, 2)}%</span>`).join('');
  $('nota').textContent = `Fonte: ${D.fonte}. Percentuais dos candidatos sobre os votos válidos (sem brancos e nulos); brancos e nulos sobre o total de votos. Totais conferidos com o resultado oficial: Flávio ${I(somaBR[0])}, Lula ${I(somaBR[1])}, ${I(valBR)} votos válidos. "Exterior" são as cidades estrangeiras onde há seções eleitorais.`;
  desenhar();
})();
</script>
